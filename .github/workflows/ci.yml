name: CI

on:
  push:
    branches: [ main ]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Build (system csc.exe)
        shell: powershell
        run: .\build.ps1

      - name: Self test
        shell: powershell
        run: |
          $p = Start-Process -FilePath .\dist\Skylark.exe -ArgumentList '--selftest' -PassThru -Wait
          Get-Content "$env:TEMP\skylark-selftest.log" -Encoding UTF8
          if ($p.ExitCode -ne 0) { throw "selftest failed (exit $($p.ExitCode))" }

      - name: Upload exe
        uses: actions/upload-artifact@v7
        with:
          name: Skylark-dev
          path: dist/Skylark.exe
