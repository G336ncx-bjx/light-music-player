name: CI

on:
  push:
    branches: [ main ]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Build (system csc.exe)
        shell: powershell
        run: .\build.ps1

      - name: Self test
        shell: powershell
        run: |
          $p = Start-Process -FilePath .\dist\Skylark.exe -ArgumentList '--selftest' -PassThru -Wait
          Get-Content "$env:TEMP\skylark-selftest.log" -Encoding UTF8
          if ($p.ExitCode -ne 0) { throw "selftest failed (exit $($p.ExitCode))" }

      - name: Prepare Android signing key
        shell: powershell
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          KEYSTORE_PASS: ${{ secrets.ANDROID_KEYSTORE_PASS }}
        run: |
          # NOTE: keep this block ASCII-only. Windows PowerShell 5.1 reads the
          # generated temp script with the ANSI code page, so non-ASCII text
          # here breaks the parser.
          if ($env:KEYSTORE_BASE64) {
            [IO.File]::WriteAllBytes("$PWD\android\skylark.jks", [Convert]::FromBase64String($env:KEYSTORE_BASE64))
            [IO.File]::WriteAllText("$PWD\android\keystore.pass", $env:KEYSTORE_PASS)
            Write-Output 'signing: using the repository keystore (same as releases)'
          } else {
            Write-Output 'signing: ANDROID_KEYSTORE_BASE64 is not set, a throwaway key will be generated (test only)'
          }

      - name: Build Android APK
        shell: powershell
        run: .\android\build.ps1

      - name: Upload exe
        uses: actions/upload-artifact@v7
        with:
          name: Skylark-dev
          path: |
            dist/Skylark.exe
            dist/Skylark-android.apk
